services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mx100-app
    container_name: mx100-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - mx100-network

  web:
    image: nginx:alpine
    container_name: mx100-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mx100-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mx100-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mx100
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - mx100-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mx100-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    networks:
      - mx100-network
    depends_on:
      - db

networks:
  mx100-network:
    driver: bridge

volumes:
  dbdata:
